<section class="page-heading"><div><p class="overline">Conta</p><h1>Meu perfil</h1><p>Atualize os dados disponíveis para sua conta no sistema.</p></div></section>
<section class="form-panel"><form [formGroup]="profileForm" (ngSubmit)="save()">
  <mat-form-field appearance="outline"><mat-label>E-mail</mat-label><input matInput type="email" formControlName="email" autocomplete="email"><mat-error>Informe um e-mail válido.</mat-error></mat-form-field>
  <mat-form-field appearance="outline"><mat-label>Nova senha</mat-label><input matInput type="password" formControlName="password" autocomplete="new-password"><mat-hint>Deixe em branco para manter a senha atual.</mat-hint><mat-error>A senha deve ter pelo menos 6 caracteres.</mat-error></mat-form-field>
  @if (feedback) { <p class="feedback success">{{ feedback }}</p> } @if (errorMessage) { <p class="feedback error" role="alert">{{ errorMessage }}</p> }
  <div class="form-actions"><button mat-button type="button" (click)="goBack()">Cancelar</button><button mat-flat-button color="primary" type="submit" [disabled]="isSaving">{{ isSaving ? 'Salvando...' : 'Salvar alterações' }}</button></div>
</form></section>
